  <div id="root"></div>

  <!-- Application Logic compiled in-browser -->
  <script type="text/babel" data-type="module">
    const { useState, useEffect, useRef } = React;

    // 1. Firebase CDN Imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

    // 2. Native SVG Icon Components

    const BarChart3 = (p) => <SvgIcon {...p}><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></SvgIcon>;
    const PlusCircle = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></SvgIcon>;

    const Printer = (p) => <SvgIcon {...p}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></SvgIcon>;
    const ListCheck = (p) => <SvgIcon {...p}><path d="M11 18H3"/><path d="M16 18H14"/><path d="M11 12H3"/><path d="M16 12H14"/><path d="M11 6H3"/><path d="M16 6H14"/><path d="m3 15 2 2 4-4"/></SvgIcon>;
    const TrendingUp = (p) => <SvgIcon {...p}><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></SvgIcon>;
    const Layers = (p) => <SvgIcon {...p}><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></SvgIcon>;
    const Database = (p) => <SvgIcon {...p}><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></SvgIcon>;
    const Building2 = (p) => <SvgIcon {...p}><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"/><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"/><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"/><path d="M10 6h4"/><path d="M10 10h4"/><path d="M10 14h4"/><path d="M10 18h4"/></SvgIcon>;
    const Download = (p) => <SvgIcon {...p}><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></SvgIcon>;
    const Smartphone = (p) => <SvgIcon {...p}><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></SvgIcon>;
    const PieChart = (p) => <SvgIcon {...p}><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></SvgIcon>;
    const FileSpreadsheet = (p) => <SvgIcon {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M8 13h2"/><path d="M14 13h2"/><path d="M8 17h2"/><path d="M14 17h2"/></SvgIcon>;
    const FileCode = (p) => <SvgIcon {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="m10 13-2 2 2 2"/><path d="m14 13 2 2-2 2"/></SvgIcon>;
    const DollarSign = (p) => <SvgIcon {...p}><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></SvgIcon>;
    const Trash2 = (p) => <SvgIcon {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></SvgIcon>;
    const Edit2 = (p) => <SvgIcon {...p}><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></SvgIcon>;
    const MapPin = (p) => <SvgIcon {...p}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></SvgIcon>;
    const Camera = (p) => <SvgIcon {...p}><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></SvgIcon>;
    const Star = (p) => <SvgIcon {...p}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></SvgIcon>;
    const NoteIcon = (p) => <SvgIcon {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/></SvgIcon>;
    const GitBranch = (p) => <SvgIcon {...p}><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></SvgIcon>;
    const MoreHorizontal = (p) => <SvgIcon {...p}><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></SvgIcon>;
    const CheckCircle2 = (p) => <SvgIcon {...p}><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></SvgIcon>;
    const KeyRound = (p) => <SvgIcon {...p}><path d="M2 18v3c0 .6.4 1 1 1h4v-3h3v-3h2l1.4-1.4a6.5 6.5 0 1 0-4-4Z"/><circle cx="16.5" cy="7.5" r=".5"/></SvgIcon>;
    const ShieldCheck = (p) => <SvgIcon {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></SvgIcon>;
    const AlertTriangle = (p) => <SvgIcon {...p}><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></SvgIcon>;
    const Mail = (p) => <SvgIcon {...p}><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></SvgIcon>;
    const BookOpen = (p) => <SvgIcon {...p}><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></SvgIcon>;
    const Shield = (p) => <SvgIcon {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></SvgIcon>;
    const Wifi = (p) => <SvgIcon {...p}><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.94 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></SvgIcon>;
    const WifiOff = (p) => <SvgIcon {...p}><line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.9 10.9 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.58 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></SvgIcon>;
    const MapIcon = (p) => <SvgIcon {...p}><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></SvgIcon>;
    const FileDown = (p) => <SvgIcon {...p}><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="M12 18v-6"/><path d="m9 15 3 3 3-3"/></SvgIcon>;

    // Geolocation Helper
    const Geolocation = {
      getCurrentPosition: () => new Promise((resolve, reject) => {
        if (!navigator.geolocation) return reject(new Error("Geolocation not supported"));
        navigator.geolocation.getCurrentPosition(resolve, reject, { enableHighAccuracy: true, timeout: 15000 });
      })
    };

   // ==========================================
    // FIREBASE CLOUD CONFIGURATION
    // ==========================================
    const firebaseConfig = {
      apiKey: "AIzaSyDLBsTRkZ_CkRnuNyveGsiRfx0Mhv881EU",
  authDomain: "gmel-system.firebaseapp.com",
  projectId: "gmel-system",
  storageBucket: "gmel-system.firebasestorage.app",
  messagingSenderId: "299050276374",
  appId: "1:299050276374:web:41d9580e96bae8b1a90737",
    };

    let db = null;
    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
    } catch (e) {
      console.error("Firebase init note:", e);
    }

    const createId = (prefix) => `${prefix}-${globalThis.crypto.randomUUID()}`;

    // Default Initial M&E Projects (Used only if Firestore document is brand new/empty)
    const defaultInitialProjects = [
      {
        id: 'proj-1',
        name: 'Sustainable Water Support',
        code: 'SWS-001',
        donor: 'WASH Fund',
        budget: '$30,000',
        location: 'Arusha Region',
        indicators: [
          { 
            id: 'ind-1', 
            level: 'Outcome', 
            title: '% Water points functional during dry seasons', 
            baseline: { general: 0, male: 0, female: 0, total: 0 }, 
            target: { general: 77, male: 0, female: 0, total: 77 }, 
            unit: '%', 
            mappedFieldId: null, 
            calcType: 'PERCENTAGE' 
          },
          { 
            id: 'ind-2', 
            level: 'Output', 
            title: '# of new or rehabilitated water points', 
            baseline: { general: 0, male: 0, female: 0, total: 0 }, 
            target: { general: 100, male: 0, female: 0, total: 100 }, 
            unit: 'number', 
            mappedFieldId: null, 
            calcType: 'SUM' 
          }
        ],
        forms: [
          {
            id: 'form-1',
            title: 'Water Point Assessment Form',
            description: 'Record water point functionality and location.',
            fields: [
              { id: 'field-name', label: 'Water Point Name', type: 'text', required: true, skipLogic: null },
              { id: 'field-status', label: 'Functional Status', type: 'select', options: ['Functional', 'Broken Down'], required: true, skipLogic: null },
              { id: 'field-gps', label: 'GPS Location', type: 'location', required: true, skipLogic: null }
            ]
          }
        ],
        submissions: [],
        expenses: [
          { id: 'exp-1', title: 'Community Mobilization Workshop', amount: 4500, date: '2026-06-12' },
          { id: 'exp-2', title: 'Borehole Hardware Procurement', amount: 8200, date: '2026-07-01' }
        ]
      }
    ];

    function App() {
      const [projects, setProjects] = useState([]);
      const [activeProjectId, setActiveProjectId] = useState('proj-1');
      const [activeTab, setActiveTab] = useState('dashboard');
      const [userRole, setUserRole] = useState('Administrator');
      const [license, setLicense] = useState({
        code: 'DEMO-5DAYS',
        level: 'Level 1: 5-Day Demo',
        demoClaimed: true,
        activatedAt: new Date().toISOString(),
        expiresAt: new Date(Date.now() + 5 * 24 * 60 * 60 * 1000).toISOString()
      });
      const [isLoadedFromCloud, setIsLoadedFromCloud] = useState(false);
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [installPrompt, setInstallPrompt] = useState(null);
      const [showMobileMenu, setShowMobileMenu] = useState(false);
      const [isSyncing, setIsSyncing] = useState(false);
      const [lastSynced, setLastSynced] = useState('Just now');

      useEffect(() => {
        const handleOnline = () => setIsOnline(true);
        const handleOffline = () => setIsOnline(false);
        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
        };
      }, []);

      const handleManualSync = async () => {
        if (isSyncing) return;
        setIsSyncing(true);

        try {
          if (Array.isArray(projects)) {
            localStorage.setItem('gmel_projects_v2', JSON.stringify(projects));
          }
          if (license) {
            localStorage.setItem('gmel_license_v2', JSON.stringify(license));
          }

          if (db) {
            const docRef = doc(db, 'gmel_systems', 'main_workspace');
            await setDoc(docRef, { projects, license, updated_at: new Date() }, { merge: true });
          }

          const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
          setLastSynced(timeString);
          alert('Cloud Synchronization Successful: All project submissions, indicators, forms, and licenses are securely synced!');
        } catch (err) {
          console.error('Synchronization error:', err);
          alert('Sync completed with local offline storage fallback.');
        } finally {
          setIsSyncing(false);
        }
      };

     // FETCH DATA OR AUTO-INITIALIZE IN FIREBASE FIRESTORE ON MOUNT
      useEffect(() => {
        async function fetchCloudData() {
          try {
            if (!db) {
              console.warn('Firebase DB not initialized.');
              setIsLoadedFromCloud(true);
              return;
            }
            const docRef = doc(db, 'gmel_systems', 'main_workspace');
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
              const data = docSnap.data();
              if (data.projects && Array.isArray(data.projects)) {
                setProjects(data.projects);
                if (data.projects.length > 0) setActiveProjectId(data.projects[0].id);
              }
              if (data.license && data.license.code) setLicense(data.license);
            } else {
              // Document doesn't exist yet! Automatically create it with default data.
              await setDoc(docRef, { 
                projects: defaultInitialProjects, 
                license: {
                  code: 'DEMO-5DAYS',
                  level: 'Level 1: 5-Day Demo',
                  demoClaimed: true,
                  activatedAt: new Date().toISOString(),
                  expiresAt: new Date(Date.now() + 5 * 24 * 60 * 60 * 1000).toISOString()
                }, 
                updated_at: new Date() 
              });
              setProjects(defaultInitialProjects);
            }
          } catch (err) {
            console.error('Error connecting to Firebase Firestore:', err);
            // Fallback safety: bypass cloud block so the app opens immediately
            setIsLoadedFromCloud(true);
          } finally {
            setIsLoadedFromCloud(true);
          }
        }
        fetchCloudData();
      }, []);

      // SAVE DATA EXCLUSIVELY TO FIREBASE FIRESTORE ON STATE CHANGE
      useEffect(() => {
        if (!isLoadedFromCloud || !db) return;

        async function saveCloudData() {
          try {
            const docRef = doc(db, 'gmel_systems', 'main_workspace');
            await setDoc(docRef, { projects, license, updated_at: new Date() }, { merge: true });
          } catch (err) {
            console.error('Error saving to Firebase:', err);
          }
        }
        saveCloudData();
      }, [projects, license, isLoadedFromCloud]);

      useEffect(() => {
        const handleInstallAvailable = (event) => {
          event.preventDefault();
          setInstallPrompt(event);
        };
        window.addEventListener('beforeinstallprompt', handleInstallAvailable);
        return () => window.removeEventListener('beforeinstallprompt', handleInstallAvailable);
      }, []);

      const handleInstallApp = async () => {
        if (!installPrompt) return;
        await installPrompt.prompt();
        await installPrompt.userChoice;
        setInstallPrompt(null);
      };
      
      const [showAddProjectModal, setShowAddProjectModal] = useState(false);
      const [showEditProjectModal, setShowEditProjectModal] = useState(false);
      const [selectedPrintFormId, setSelectedPrintFormId] = useState('');
      
      const [newProj, setNewProj] = useState({ name: '', code: '', donor: '', budget: '', location: '' });
      const [editProj, setEditProj] = useState({ name: '', code: '', donor: '', budget: '', location: '' });

      const currentProject = projects.find(p => p.id === activeProjectId) || projects[0] || { id: '', name: 'No Projects', code: '', indicators: [], forms: [], submissions: [] };

      const isExpired = license.expiresAt && new Date() > new Date(license.expiresAt);

      if (!isLoadedFromCloud) {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center font-sans text-white text-base">
            <div className="text-center space-y-3">
              <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-500 mx-auto"></div>
              <p className="text-base text-slate-300">Connecting to Firebase Cloud Database...</p>
            </div>
          </div>
        );
      }

      if (isExpired) {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 font-sans text-white text-base">
            <div className="max-w-xl w-full">
              <div className="text-center mb-6">
                <div className="bg-red-600 p-4 rounded-2xl w-fit mx-auto shadow-lg mb-3">
                  <AlertTriangle className="h-10 w-10 text-white" />
                </div>
                <h1 className="text-3xl font-extrabold tracking-tight">DEMO PERIOD HAS EXPIRED</h1>
                <p className="text-base text-slate-300 mt-2">Your 5-day evaluation trial has ended. Please enter an activation code to continue.</p>
              </div>
              <LicenseActivationView license={license} setLicense={setLicense} isGateway={true} />
            </div>
          </div>
        );
      }

      return (
        <div className="app-shell min-h-screen bg-white text-slate-900 flex flex-col font-sans text-sm sm:text-base border-t-4 border-indigo-600">
          <header className="app-header bg-slate-900 text-white shadow-lg sticky top-0 z-50 print:hidden">
            <div className="header-inner max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-20">
              <div className="brand flex items-center space-x-3">
                <div className="bg-indigo-600 p-2.5 rounded-xl shadow-inner">
                  <Layers className="h-7 w-7 text-white" />
                </div>
                <div>
                  <h1 className="text-2xl font-black tracking-tight text-white flex items-center gap-2">
                    GMEL System
                  </h1>
                </div>
              </div>

              <div className="project-toolbar flex items-center space-x-3 sm:space-x-4">
                <div className={`hidden lg:flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-bold border ${isOnline ? 'bg-emerald-950 text-emerald-300 border-emerald-800' : 'bg-amber-950 text-amber-300 border-amber-800'}`}>
                  {isOnline ? <Wifi className="h-4 w-4 text-emerald-400" /> : <WifiOff className="h-4 w-4 text-amber-400" />}
                  <span>{isOnline ? 'Firebase Connected' : 'Offline'}</span>
                </div>

                <div className="flex items-center space-x-1 bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700 text-xs font-bold text-slate-300">
                  <Shield className="h-4 w-4 text-indigo-400" />
                  <select 
  value={userRole} 
  onChange={(e) => {
    const selected = e.target.value;
    if (selected === 'Administrator' || selected === 'M&E Officer') {
      const pin = prompt(`Enter secure PIN to switch to ${selected}:`);
      if (pin === 'GMEL2026!') {
        setUserRole(selected);
      } else {
        alert('Incorrect security PIN! Access denied.');
      }
    } else {
      setUserRole(selected);
      setActiveTab('entry'); // Automatically lock to Data Submission view
    }
  }}
  className="bg-transparent text-white font-bold focus:outline-none cursor-pointer"
>
  <option value="Administrator" className="bg-slate-800">Role: Admin</option>
  <option value="M&E Officer" className="bg-slate-800">Role: M&amp;E Officer</option>
  <option value="Enumerator" className="bg-slate-800">Role: Enumerator</option>
</select>
                </div>

                <div className="project-picker flex items-center space-x-2 bg-slate-800 px-3.5 py-2 rounded-xl border border-slate-700 shadow-sm">
                  <Building2 className="h-5 w-5 text-indigo-400" />
                  <label htmlFor="project-select" className="text-sm text-slate-300 font-semibold">Project:</label>
                  <select 
                    id="project-select"
                    value={activeProjectId} 
                    onChange={(e) => setActiveProjectId(e.target.value)}
                    className="bg-transparent text-base font-bold text-white focus:outline-none cursor-pointer max-w-[140px] sm:max-w-[200px] truncate"
                  >
                    {projects.map(p => (
                      <option key={p.id} value={p.id} className="bg-slate-800 text-white">{p.name} ({p.code})</option>
                    ))}
                  </select>
                </div>

                {installPrompt && (
                  <button

    function getCalculatedActual(project, ind) {
      const defaultVal = { general: 0, male: 0, female: 0, total: 0 };
      if (!ind) return defaultVal;

      // Fallback safety check for legacy or uninitialized mappings
      const mapping = ind.mapping || {
        generalFieldId: ind.mappedFieldId || null,
        maleFieldId: null,
        femaleFieldId: null
      };

      const computeValuesForField = (fieldId, calcType) => {
        if (!fieldId) return 0;
        const values = (project.submissions || []).map(sub => {
          const val = sub.data[fieldId];
          if (Array.isArray(val)) return val.length;
          return Number(val);
        }).filter(v => !isNaN(v));

        if (values.length === 0) return 0;

        if (calcType === 'AVG') return Number((values.reduce((a, b) => a + b, 0) / values.length).toFixed(1));
        if (calcType === 'COUNT') return values.length;
        if (calcType === 'MAX') return Math.max(...values);
        if (calcType === 'PERCENTAGE') return Number(((values.filter(v => v > 0).length / values.length) * 100).toFixed(0));
        return values.reduce((a, b) => a + b, 0);
      };

      const genVal = computeValuesForField(mapping.generalFieldId, ind.calcType);
      const maleVal = computeValuesForField(mapping.maleFieldId, ind.calcType);
      const femaleVal = computeValuesForField(mapping.femaleFieldId, ind.calcType);

      const calculatedTotal = (mapping.maleFieldId || mapping.femaleFieldId) 
        ? (maleVal + femaleVal) 
        : genVal;

      return {
        general: genVal,
        male: maleVal,
        female: femaleVal,
        total: calculatedTotal
      };
    }
    
    function exportCSV(dataArray, filename) {
      if (!dataArray || dataArray.length === 0) {
        alert('No data available to export.');
        return;
      }
      const csvContent = "data:text/csv;charset=utf-8," + [
        Object.keys(dataArray[0]).join(","),
        ...dataArray.map(item => Object.values(item).map(v => typeof v === 'object' ? JSON.stringify(v) : `"${v}"`).join(","))
      ].join("\n");
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    function GISMapView({ project }) {
      const mapRef = useRef(null);

      useEffect(() => {
        const gpsPoints = [];
        project.submissions.forEach(sub => {
          Object.entries(sub.data).forEach(([key, val]) => {
            if (typeof val === 'string' && val.includes(',') && val.split(',').length === 2) {
              const [lat, lng] = val.split(',').map(n => parseFloat(n.trim()));
              if (!isNaN(lat) && !isNaN(lng)) {
                gpsPoints.push({ lat, lng, subId: sub.id, timestamp: sub.timestamp });
              }
            }
          });
        });

        if (!window.L) {
          const script = document.createElement('script');
          script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
          script.async = true;
          script.onload = () => initMap(gpsPoints);
          document.body.appendChild(script);

          const css = document.createElement('link');
          css.rel = 'stylesheet';
          css.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
          document.head.appendChild(css);
        } else {
          initMap(gpsPoints);
        }

        function initMap(points) {
          if (!mapRef.current) return;
          if (mapRef.current._leaflet_id) {
            mapRef.current._leaflet_id = null;
            mapRef.current.innerHTML = '';
          }

          const defaultLat = points.length > 0 ? points[0].lat : -3.3869;
          const defaultLng = points.length > 0 ? points[0].lng : 36.6829;

          const map = window.L.map(mapRef.current).setView([defaultLat, defaultLng], 10);
          window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
          }).addTo(map);

          points.forEach(pt => {
            window.L.marker([pt.lat, pt.lng])
              .addTo(map)
              .bindPopup(`<b>Submission:</b> ${pt.subId}<br/><b>Time:</b> ${pt.timestamp}<br/><b>GPS:</b> ${pt.lat}, ${pt.lng}`);
          });
        }
      }, [project]);

      return (
        <div className="space-y-6 text-base">
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
            <h2 className="text-2xl font-black text-slate-900 flex items-center gap-2">
              <MapIcon className="h-7 w-7 text-indigo-600" /> Geospatial GIS Map Intelligence
            </h2>
            <p className="text-base text-slate-600 mt-1">Interactive map plotting all GPS coordinates captured across survey submissions for {project.name}.</p>
          </div>

          <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200">
            <div ref={mapRef} className="w-full h-[550px] rounded-xl border border-slate-300 z-10"></div>
          </div>
        </div>
      );
    }

function DashboardView({ project, getCalculatedActual, onOpenEditProject, setProjects }) {
      const [showExpenseModal, setShowExpenseModal] = useState(false);
      const [editingExpenseId, setEditingExpenseId] = useState(null);
      const [newExp, setNewExp] = useState({ title: '', amount: '', date: '' });

      const levels = [
        { name: 'Impact', color: '#b7791f' },
        { name: 'Outcome', color: '#5265d8' },
        { name: 'Output', color: '#12977a' },
        { name: 'Activity', color: '#8291a7' }
      ];
      const totalIndicators = project.indicators.length;
      let chartPosition = 0;
      const chartSegments = levels.map(level => {
        const count = project.indicators.filter(indicator => indicator.level === level.name).length;
        const percentage = totalIndicators ? (count / totalIndicators) * 100 : 0;
        const segment = `${level.color} ${chartPosition}% ${chartPosition + percentage}%`;
        chartPosition += percentage;
        return segment;
      }).join(', ');

      let totalPctSum = 0;
      project.indicators.forEach(ind => {
        const actualObj = getCalculatedActual(project, ind);
        const actualVal = actualObj.total || actualObj.general || 0;
        const targetVal = (ind.target && typeof ind.target === 'object') ? (ind.target.total || ind.target.general || 1) : 1;
        const baseVal = (ind.baseline && typeof ind.baseline === 'object') ? (ind.baseline.total || ind.baseline.general || 0) : 0;
        const pct = Math.min(100, Math.max(0, Math.round(((actualVal - baseVal) / (targetVal - baseVal || 1)) * 100)));
        totalPctSum += pct;
      });
      const avgPerformance = totalIndicators > 0 ? Math.round(totalPctSum / totalIndicators) : 0;
      
      let healthStatus = 'On Track 🚀';
      let healthColor = 'bg-emerald-100 text-emerald-800 border-emerald-300';
      if (avgPerformance < 40) {
        healthStatus = 'Needs Attention ⚠️';
        healthColor = 'bg-amber-100 text-amber-800 border-amber-300';
      } else if (avgPerformance >= 90) {

      const projectExpenses = project.expenses || [];

      const utilizationRate = Math.min(100, Math.round((totalSpent / rawBudgetNum) * 100));

   function ExportSuiteView({ project }) {
      const [selectedFormIdForExport, setSelectedFormIdForExport] = React.useState(project.forms[0]?.id || '');
      const [exportFormat, setExportFormat] = React.useState('csv');

      // Keep selected form synced if project changes
      React.useEffect(() => {
        if (project.forms && project.forms.length > 0 && !project.forms.find(f => f.id === selectedFormIdForExport)) {
          setSelectedFormIdForExport(project.forms[0].id);
        }
      }, [project]);

      const activeFormForExport = project.forms.find(f => f.id === selectedFormIdForExport);

      const handleExportFormSubmissions = () => {
        if (!activeFormForExport) {
          alert('Please select a valid form to export.');
          return;
        }

        // Filter submissions belonging ONLY to this specific form
        const formSubmissions = (project.submissions || []).filter(sub => sub.id.includes(selectedFormIdForExport) || sub.formId === selectedFormIdForExport);

        if (formSubmissions.length === 0) {
          alert(`No submitted records found for form: "${activeFormForExport.title}".`);
          return;
        }

        // Map question IDs to human-readable question labels for column headers
        const fields = activeFormForExport.fields || [];
        const headerMap = {};
        fields.forEach(field => {
          headerMap[field.id] = field.label || field.id;
        });

        // Format rows containing ONLY the questions asked in this form
        const formattedRows = formSubmissions.map(sub => {
          const rowData = {
            'Submission ID': sub.id,
            'Timestamp': sub.timestamp
          };

          fields.forEach(field => {
            const label = headerMap[field.id];
            const val = sub.data ? sub.data[field.id] : '';
            rowData[label] = Array.isArray(val) ? val.join(', ') : (val !== undefined && val !== null ? val : '');
          });

          return rowData;
        });

        const filenamePrefix = `${project.code}_${activeFormForExport.title.replace(/[^a-zA-Z0-9]/g, '_')}`;

        if (exportFormat === 'xlsx') {
          // Export as Tab-Delimited Excel Compatible File (.xls) so Excel opens it with proper column headers
          let excelContent = "data:application/vnd.ms-excel;charset=utf-8," + [
            Object.keys(formattedRows[0]).join("\t"),
            ...formattedRows.map(row => Object.values(row).map(v => `"${String(v).replace(/"/g, '""')}"`).join("\t"))
          ].join("\n");
          
          const encodedUri = encodeURI(excelContent);
          const link = document.createElement("a");
          link.setAttribute("href", encodedUri);
          link.setAttribute("download", `${filenamePrefix}_analysis.xls`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        } else {
          // Standard CSV Export
          const csvContent = "data:text/csv;charset=utf-8," + [
            Object.keys(formattedRows[0]).join(","),
            ...formattedRows.map(row => Object.values(row).map(v => `"${String(v).replace(/"/g, '""')}"`).join(","))
          ].join("\n");

          const encodedUri = encodeURI(csvContent);
          const link = document.createElement("a");
          link.setAttribute("href", encodedUri);
          link.setAttribute("download", `${filenamePrefix}_analysis.csv`);
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        }
      };

      const handleExportLogframe = () => {
        if (!project.indicators || project.indicators.length === 0) {
          alert('No indicators available in the Logframe to export.');
          return;
        }
        const logframeData = project.indicators.map(ind => ({
          Level: ind.level,
          Statement: ind.title,
          Unit: ind.unit,
          'Baseline (Gen)': ind.baseline?.general || 0,
          'Baseline (Male)': ind.baseline?.male || 0,
          'Baseline (Female)': ind.baseline?.female || 0,
          'Baseline (Total)': ind.baseline?.total || 0,
          'Target (Gen)': ind.target?.general || 0,
          'Target (Male)': ind.target?.male || 0,
          'Target (Female)': ind.target?.female || 0,
          'Target (Total)': ind.target?.total || 0,
          Formula: ind.calcType || 'SUM'
        }));
        exportCSV(logframeData, `${project.code}_logframe_matrix.csv`);
      };

      const handleExportExpenses = () => {
        if (!project.expenses || project.expenses.length === 0) {
          alert('No expense records available to export.');
          return;
        }
        exportCSV(project.expenses, `${project.code}_budget_expenses.csv`);
      };

      const handleGenerateDonorPDF = () => {

        const rawBudgetNum = parseFloat(String(project.budget || '0').replace(/[^0-9.]/g, '')) || 1;

          const targetTotal = ind.target?.total || ind.target?.general || 1;
          const actualTotal = actual.total || actual.general || 0;
          const pct = Math.min(100, Math.max(0, Math.round((actualTotal / targetTotal) * 100)));
          return `

        code: 'DEMO-5DAYS',
        activatedAt: new Date().toISOString(),
        expiresAt: new Date(Date.now() + 5 * 24 * 60 * 60 * 1000).toISOString(),
        demoClaimed: true
      };

      const now = new Date();
      const expiresDate = safeLicense.expiresAt ? new Date(safeLicense.expiresAt) : new Date();
      const isExpired = now > expiresDate;
      const daysRemaining = Math.max(0, Math.ceil((expiresDate - now) / (1000 * 60 * 60 * 24)));

      const handleActivateKey = (e) => {
        e.preventDefault();
        const code = inputKey.trim().toUpperCase();
        if (!code) return;

        // PREVENT REPEATING PREVIOUS KEYS OR DEMO
        if (code === 'DEMO-5DAYS') {
          setStatusMsg({ type: 'error', text: 'The 5-Day Demo has already been automatically claimed on this workspace.' });
          return;
        }

        let newTier = null;
        if (code.startsWith('GMEL-STD-') && code.length >= 12) {
          newTier = {
            code,
            level: 'Level 2: Standard Annual (1 Year)',
            demoClaimed: true,
            activatedAt: new Date().toISOString(),
            expiresAt: new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toISOString()
          };
        } else if (code.startsWith('GMEL-ENT-') && code.length >= 12) {
          newTier = {
            code,
            level: 'Level 3: Enterprise Unlimited (3 Years)',
            demoClaimed: true,
            activatedAt: new Date().toISOString(),
            expiresAt: new Date(Date.now() + 3 * 365 * 24 * 60 * 60 * 1000).toISOString()
          };
        } else {
          setStatusMsg({ type: 'error', text: 'Invalid license key format. Use valid GMEL-STD-XXXX or GMEL-ENT-XXXX keys.' });
          return;
        }

        if (typeof setLicense === 'function') {
          setLicense(newTier);
        }
        setInputKey('');
        setStatusMsg({ type: 'success', text: `Successfully activated ${newTier.level}! Synced to cloud storage.` });
      };

      return (
        <div className="space-y-6 text-base max-w-4xl mx-auto">
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            <div>
              <h2 className="text-2xl font-black text-slate-900">GMEL System License &amp; Subscription</h2>
              <p className="text-base text-slate-600 mt-1">Manage workspace activation keys, tier entitlements, and renewal status.</p>
            </div>
            <span className={`px-4 py-2 rounded-xl text-sm font-extrabold border ${isExpired ? 'bg-red-100 text-red-800 border-red-300' : 'bg-emerald-100 text-emerald-800 border-emerald-300'}`}>
              {isExpired ? 'Status: Expired' : `Active · ${daysRemaining} Days Left`}
            </span>
          </div>

          <div className="bg-slate-900 text-white p-6 sm:p-8 rounded-2xl shadow-lg border border-slate-800 space-y-6">
            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-slate-800 pb-5">
              <div>
                <span className="text-xs font-extrabold uppercase tracking-wider text-indigo-400">Current Workspace Entitlement</span>
                <h3 className="text-2xl font-black mt-1">{safeLicense.level || 'Level 1: 5-Day Demo'}</h3>
              </div>
              <div className="bg-slate-800 px-4 py-2.5 rounded-xl border border-slate-700 font-mono text-sm">
                Key: <strong className="text-emerald-400">{safeLicense.code || 'DEMO-5DAYS'}</strong>
              </div>
            </div>

            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4 text-sm">
              <div className="bg-slate-800/70 p-4 rounded-xl border border-slate-700/80">
                <span className="text-slate-400 block text-xs uppercase font-bold">Activated On</span>
                <strong className="text-base font-mono mt-1 block">
                  {safeLicense.activatedAt ? new Date(safeLicense.activatedAt).toLocaleDateString() : 'N/A'}
                </strong>
              </div>
              <div className="bg-slate-800/70 p-4 rounded-xl border border-slate-700/80">
                <span className="text-slate-400 block text-xs uppercase font-bold">Expiration Date</span>
                <strong className={`text-base font-mono mt-1 block ${isExpired ? 'text-red-400' : 'text-white'}`}>
                  {safeLicense.expiresAt ? new Date(safeLicense.expiresAt).toLocaleDateString() : 'N/A'}
                </strong>
              </div>
              <div className="bg-slate-800/70 p-4 rounded-xl border border-slate-700/80">
                <span className="text-slate-400 block text-xs uppercase font-bold">Cloud Sync &amp; Projects</span>
                <strong className="text-base text-indigo-300 mt-1 block">Unlimited Projects &amp; Forms</strong>
              </div>
            </div>
          </div>

          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4">
            <h3 className="text-lg font-extrabold text-slate-900">Activate or Upgrade License Key</h3>
            <p className="text-sm text-slate-600">Enter an official GMEL activation key issued by Enrich Data Tanzania to extend your subscription.</p>

            {statusMsg && (
              <div className={`p-4 rounded-xl text-sm font-bold border ${statusMsg.type === 'error' ? 'bg-red-50 text-red-800 border-red-200' : 'bg-emerald-50 text-emerald-800 border-emerald-200'}`}>
                {statusMsg.text}
              </div>
            )}

            <form onSubmit={handleActivateKey} className="flex flex-col sm:flex-row gap-3">
              <input
                type="text"
                required
                placeholder="Enter Activation Key for Standard (Annually) or Enterprise (Lifetime)"
                value={inputKey}
                onChange={(e) => setInputKey(e.target.value)}
                className="flex-1 border border-slate-300 rounded-xl p-3.5 font-mono font-bold uppercase text-slate-900 focus:outline-none focus:border-indigo-600"
              />
              <button
                type="submit"
                className="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3.5 rounded-xl font-extrabold text-sm shadow transition shrink-0"
              >
                Activate Key
              </button>
            </form>

            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-4 border-t border-slate-200">
              {/* TIER 2 UPGRADE BUTTON */}
              <div className="p-5 rounded-2xl bg-indigo-50/70 border border-indigo-200 space-y-3 flex flex-col justify-between">
                <div>
                  <span className="text-xs font-extrabold text-indigo-600 uppercase">Tier 2 Plan</span>
                  <h4 className="font-extrabold text-slate-900 text-lg">Standard Annual License</h4>
                  <p className="text-xs text-slate-600 mt-1">365-day full organizational license with GIS mapping &amp; PDF exports.</p>
                </div>
                <div className="flex gap-2 pt-2">
                  <a 
                    href="mailto:info.enrichdata@gmail.com?subject=Request%20GMEL%20Standard%20License%20Key&body=Hello,%20I%20would%20like%20to%20request%20a%20Standard%20Annual%20License%20key%20for%20our%20workspace." 
                    className="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold py-2.5 px-4 rounded-xl text-xs text-center shadow transition"
                  >
                    Request via Email
                  </a>
                  <a 
                    href="tel:+255758216364" 
                    className="bg-white hover:bg-slate-100 text-indigo-900 border border-indigo-300 font-extrabold py-2.5 px-4 rounded-xl text-xs text-center shadow transition"
                  >
                    Call Support
                  </a>
                </div>
              </div>

              {/* TIER 3 UPGRADE BUTTON */}
              <div className="p-5 rounded-2xl bg-emerald-50/70 border border-emerald-200 space-y-3 flex flex-col justify-between">
                <div>
                  <span className="text-xs font-extrabold text-emerald-700 uppercase">Tier 3 Plan</span>
                  <h4 className="font-extrabold text-slate-900 text-lg">Enterprise Unlimited</h4>
                  <p className="text-xs text-slate-600 mt-1">3-year enterprise deployment with priority support &amp; unlimited seats.</p>
                </div>
                <div className="flex gap-2 pt-2">
                  <a 
                    href="mailto:info.enrichdata@gmail.com?subject=Request%20GMEL%20Enterprise%20License%20Key&body=Hello,%20I%20would%20like%20to%20request%20an%20Enterprise%20License%20key%20for%20our%20workspace." 
                    className="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-extrabold py-2.5 px-4 rounded-xl text-xs text-center shadow transition"
                  >
                    Request via Email
                  </a>
                  <a 
                    href="tel:+255758216364" 
                    className="bg-white hover:bg-slate-100 text-emerald-900 border border-emerald-300 font-extrabold py-2.5 px-4 rounded-xl text-xs text-center shadow transition"
                  >
                    Call Support
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
